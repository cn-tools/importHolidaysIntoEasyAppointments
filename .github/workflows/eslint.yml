# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: "25 8 * * 2"

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ESLint
        run: |
          npm install eslint@8.10.0
          npm install @microsoft/eslint-formatter-sarif@3.1.0
          npm install eslint-plugin-html

      - name: Run ESLint
        id: eslint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          set +e
          npx eslint . --config .eslintrc.json --ext .js,.jsx,.ts,.tsx,.html --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
          eslint_exit_code=$?
          set -e

          if [ ! -s eslint-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > eslint-results.sarif
          fi

          if grep -q '"runs": *\[\]' eslint-results.sarif; then
            echo "has_results=false" >> $GITHUB_OUTPUT
          else
            echo "has_results=true" >> $GITHUB_OUTPUT
          fi

          exit 0

      - name: Upload analysis results to GitHub
        if: steps.eslint.outputs.has_results == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          category: eslint
          wait-for-processing: false
