name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

        issue-message: |
          👋 Welcome and thanks for opening your first issue!

          We're glad you're here. Your feedback helps make this project better for everyone.

          A maintainer will take a look soon. Until then, please double-check that you've included all relevant information to help us understand and address your issue.

          Thanks for your contribution! ❤️

        pr-message: |
          🚀 Welcome and thanks for submitting your first pull request!

          We really appreciate your contribution. Our team will review your changes and provide feedback if needed.

          Thank you for helping improve the project—we're excited to have you as a contributor! 🎉
