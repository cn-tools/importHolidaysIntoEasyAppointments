name: Publish Release to GitHub Pages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Replace placeholders in HTML
        run: |
          python3 - <<'PY'
          import datetime
          import os
          from datetime import UTC
          from pathlib import Path

          path = Path('src/index.html')
          text = path.read_text(encoding='utf-8')
          current_datetime = datetime.datetime.now(UTC).strftime('%Y-%m-%dT%H:%M:%SZ')
          current_year = datetime.datetime.now(UTC).strftime('%Y')
          text = text.replace('{{current_year}}', current_year)
          text = text.replace('{{current_version_number}}', os.environ['VERSION'])
          text = text.replace('{{current_timestamp}}', current_datetime)
          path.write_text(text, encoding='utf-8')
          PY
        env:
          VERSION: ${{ github.event.release.tag_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
